    guionDeVoz(idPieza, idBloque, piezaEnEstado);
  }

  const elBloque = {
    ...encontrado,
    lineas: encontrado.lineas.map((linea) => ({ ...linea }))
  };

  // Los guiones de episodio están en español. La traducción se hace al generar el
  // bloque, solo para las líneas que realmente se van a grabar, y luego queda
  // guardada en estado.piezas para no pagarla otra vez al regenerar el bloque.
  for (const linea of elBloque.lineas) {
    if (soloTexto(linea.ja)) continue;
