          comprobar = scripts['comprobar']
          if 'npm run piezas-estado' not in comprobar:
              scripts['comprobar'] = comprobar.replace('npm run invariantes', 'npm run invariantes && npm run piezas-estado', 1)
          Path('package.json').write_text(json.dumps(paquete, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Instalar dependencias
        run: npm ci

      - name: Probar flujo de piezas dinámicas
        run: npm run piezas-estado

      - name: Ejecutar comprobaciones existentes
        run: npm run comprobar

      - name: Verificar alcance del cambio
        shell: bash
        run: |
          git restore --worktree datos/serie.json 2>/dev/null || true
          PROHIBIDOS='api/_lib/vertex.js|api/_lib/gcs.js|app/cola.js|api/_lib/montaje.js|montador/'
          if git diff --name-only HEAD | grep -E "$PROHIBIDOS"; then
            echo 'El parche tocó un archivo prohibido.' >&2
            exit 1
          fi

      - name: Dejar la rama limpia y guardar el arreglo
        shell: bash
        run: |
          rm -f .github/workflows/aplicar-piezas-estado.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/pantallas/tomas.js app/pantallas/audio.js app/pantallas/desglose.js api/_lib/datos.js api/_lib/prompt.js api/_lib/modos.js herramientas/probar-piezas-estado.mjs package.json .github/workflows/aplicar-piezas-estado.yml
          git commit -m 'fix: usar piezas desglosadas desde estado en todo el flujo'
          git push origin HEAD:fix/desglose-tomas-estado
